model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
[tui]
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-6.1-sol" = 4

[projects."/home/idkwhyiamsogood/Projects/attendify"]
trust_level = "trusted"

[projects."/home/idkwhyiamsogood/Projects/agents-settings"]
trust_level = "trusted"

[mcp_servers.figwright]
command = "bunx"
args = ["@figwright/mcp@latest"]

[mcp_servers.figwright.tools.add_page]
approval_mode = "approve"

[mcp_servers.figwright.tools.batch]
approval_mode = "approve"

[mcp_servers.figwright.tools.clone_node]
approval_mode = "approve"

[mcp_servers.figwright.tools.create_component]
approval_mode = "approve"

[mcp_servers.figwright.tools.create_frame]
approval_mode = "approve"

[mcp_servers.figwright.tools.create_text]
approval_mode = "approve"

[mcp_servers.figwright.tools.import_image]
approval_mode = "approve"

[mcp_servers.figwright.tools.import_svg]
approval_mode = "approve"

[mcp_servers.figwright.tools.navigate_to_page]
approval_mode = "approve"

[mcp_servers.figwright.tools.rename_node]
approval_mode = "approve"

[mcp_servers.figwright.tools.resize_nodes]
approval_mode = "approve"

[mcp_servers.figwright.tools.set_fills]
approval_mode = "approve"

[mcp_servers.figwright.tools.set_text_properties]
approval_mode = "approve"

[mcp_servers.figwright.tools.set_visible]
approval_mode = "approve"

[mcp_servers.figwright.tools.update_flows]
approval_mode = "approve"

[mcp_servers.drawio]
command = "npx"
args = ["-y", "@drawio/mcp"]

[mcp_servers.drawio.tools.open_drawio_xml]
approval_mode = "approve"

[mcp_servers.drawio.tools.list_pages]
approval_mode = "approve"

[mcp_servers.drawio.tools.get_drawio_reference]
approval_mode = "approve"

[mcp_servers.drawio.tools.get_page]
approval_mode = "approve"

[notice]
hide_rate_limit_model_nudge = true
